name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Tests are not run in CI (2026-11-28 decision): run them locally before pushing (TESTING_GUIDE.md).
    name: Backend (PHP ${{ matrix.php }}, MySQL 8.4) # name kept: required status checks match it
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sodium, pdo_mysql, bcmath, gd, zip, fileinfo
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Security audit (dependencies)
        run: composer audit
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Production config check
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://api.example.lk
          SESSION_SECURE_COOKIE: "true"
          SANCTUM_STATEFUL_DOMAINS: app.example.lk
          CORS_ALLOWED_ORIGINS: https://app.example.lk
          LOG_LEVEL: info
        run: php artisan app:security-check --env-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.lk
